# Qodana configuration:
# https://www.jetbrains.com/help/qodana/qodana-yaml.html

version: 1.0
bootstrap: sh ./prepare-qodana-backend.sh
ide: QDNET
dotnet:
  solution: ReSharper.Azure.sln
profile:
  name: qodana.recommended
exclude:
  - name: All
    paths:
      - src/dotnet/ReSharper.Azure/Azure.Intellisense/Templates
      - src/dotnet/ReSharper.Azure/Azure.Daemon/RunMarkers/FunctionAppRunMarkersThemedIcons.cs